name: APK Android (debug)

# Compile l'APK sur les serveurs de GitHub (gratuit) : rien à installer sur ton PC.
# Lancement à la main : onglet « Actions » du dépôt → « APK Android (debug) » → « Run workflow ».
# L'APK est ensuite à télécharger en bas de la page de l'exécution, dans « Artifacts ».
on:
  workflow_dispatch:

# Le jeton du workflow ne peut que lire le dépôt (rien à écrire : ni release, ni commit).
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 exige le JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test

      # Compile l'appli (chemins relatifs) puis copie dist/ dans le projet Android
      - run: npm run android:sync

      # Le SDK Android est préinstallé sur les machines de GitHub ; on accepte ses licences au cas où
      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: notes-maths-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
