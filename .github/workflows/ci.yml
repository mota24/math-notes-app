name: Vérification (tests + compilation)

# À chaque envoi sur GitHub, les tests et la compilation tournent sur les serveurs de GitHub (gratuit) :
# une coche verte ou rouge apparaît sur le commit. Ce workflow ne publie rien : le site en ligne est
# publié par Vercel, qui se reconstruit tout seul à chaque envoi sur `main`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
